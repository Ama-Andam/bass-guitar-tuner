<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">
  <rect width="900" height="360" rx="14" fill="#0f1216"/>
  <text x="32" y="46" fill="#7d8794" font-size="13" letter-spacing="3" text-transform="uppercase">WAVENODE  ·  SYSTEM BLOCK DIAGRAM</text>

  <!-- WaveNode board group -->
  <rect x="32" y="78" width="430" height="206" rx="12" fill="none" stroke="#2a3340" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="48" y="104" fill="#4a9eff" font-size="13" font-weight="600" letter-spacing="1">WaveNode board (ATmega328P)</text>

  <!-- Mic -->
  <rect x="52" y="128" width="110" height="60" rx="10" fill="#161b22" stroke="#232a33" stroke-width="1.5"/>
  <text x="107" y="155" fill="#e8edf2" font-size="14" font-weight="600" text-anchor="middle">Microphone</text>
  <text x="107" y="173" fill="#7d8794" font-size="11" text-anchor="middle">electret</text>

  <!-- Preamp -->
  <rect x="190" y="128" width="120" height="60" rx="10" fill="#161b22" stroke="#34d17a" stroke-width="1.5"/>
  <text x="250" y="152" fill="#e8edf2" font-size="14" font-weight="600" text-anchor="middle">Preamp +</text>
  <text x="250" y="170" fill="#e8edf2" font-size="14" font-weight="600" text-anchor="middle">bias/filter</text>

  <!-- MCU -->
  <rect x="338" y="128" width="108" height="60" rx="10" fill="#161b22" stroke="#232a33" stroke-width="1.5"/>
  <text x="392" y="152" fill="#e8edf2" font-size="14" font-weight="600" text-anchor="middle">ATmega328P</text>
  <text x="392" y="170" fill="#7d8794" font-size="11" text-anchor="middle">ADC @ 2 kHz</text>

  <!-- arrows within board -->
  <line x1="162" y1="158" x2="188" y2="158" stroke="#4a9eff" stroke-width="2"/>
  <polygon points="188,158 180,154 180,162" fill="#4a9eff"/>
  <line x1="310" y1="158" x2="336" y2="158" stroke="#4a9eff" stroke-width="2"/>
  <polygon points="336,158 328,154 328,162" fill="#4a9eff"/>

  <!-- USB serial arrow to host -->
  <line x1="446" y1="158" x2="520" y2="158" stroke="#4a9eff" stroke-width="2"/>
  <polygon points="520,158 512,154 512,162" fill="#4a9eff"/>
  <text x="483" y="148" fill="#7d8794" font-size="10" text-anchor="middle">USB serial</text>
  <text x="483" y="135" fill="#7d8794" font-size="10" text-anchor="middle">16-bit, 2 kHz</text>

  <!-- Jetson -->
  <rect x="522" y="108" width="150" height="100" rx="12" fill="#161b22" stroke="#232a33" stroke-width="1.5"/>
  <text x="597" y="140" fill="#e8edf2" font-size="14" font-weight="600" text-anchor="middle">Jetson Nano</text>
  <text x="597" y="162" fill="#7d8794" font-size="11" text-anchor="middle">autocorrelation</text>
  <text x="597" y="178" fill="#7d8794" font-size="11" text-anchor="middle">pitch detection</text>
  <text x="597" y="194" fill="#7d8794" font-size="11" text-anchor="middle">Flask server</text>

  <!-- network arrow to browser -->
  <line x1="672" y1="158" x2="746" y2="158" stroke="#4a9eff" stroke-width="2"/>
  <polygon points="746,158 738,154 738,162" fill="#4a9eff"/>
  <text x="709" y="148" fill="#7d8794" font-size="10" text-anchor="middle">LAN :5000</text>

  <!-- Browser -->
  <rect x="748" y="108" width="120" height="100" rx="12" fill="#161b22" stroke="#34d17a" stroke-width="1.5"/>
  <text x="808" y="146" fill="#e8edf2" font-size="14" font-weight="600" text-anchor="middle">Browser</text>
  <text x="808" y="166" fill="#7d8794" font-size="11" text-anchor="middle">tuner UI</text>
  <text x="808" y="182" fill="#34d17a" font-size="11" text-anchor="middle">note · cents</text>

  <!-- caption -->
  <text x="32" y="322" fill="#7d8794" font-size="12">Analog capture and conditioning live on the WaveNode board; detection and display run on the host.</text>
  <text x="32" y="342" fill="#5f6b78" font-size="11">The board is reusable; the bass tuner is its first application.</text>
</svg>
